plugins { id 'application' }
layout.buildDirectory = layout.projectDirectory.dir('target')
repositories { mavenLocal() }
dependencies { implementation 'org.ironwood.example:ironwood-values:0.1.0-local' }
sourceSets.main.java.srcDirs = ['../../value/src/main/java']
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
application { mainClass = 'org.ironwood.javabridge.consumer.Main' }
