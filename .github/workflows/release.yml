# SPDX-License-Identifier: MIT OR Apache-2.0

name: Release Ironwood IDK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify release source and frozen IronDocs
        run: ./scripts/release.sh "${GITHUB_REF_NAME#v}" --verify-tag
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --generate-notes \
              --notes "API reference: [IronDocs ${GITHUB_REF_NAME#v}]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME/docs/api/${GITHUB_REF_NAME#v})" \
              --title "Ironwood $GITHUB_REF_NAME"
          fi

  build-idk:
    name: Build ${{ matrix.platform }} IDK
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            platform: macos-arm64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            docker-platform: linux/arm64
          - runner: ubuntu-24.04
            platform: linux-x86_64
            docker-platform: linux/amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Select qualified Apple SDK
        if: matrix.platform == 'macos-arm64'
        run: |
          echo 'DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer' >> "$GITHUB_ENV"
          echo 'SDKROOT=/Applications/Xcode_27.2.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX27.2.sdk' >> "$GITHUB_ENV"
      - uses: mamba-org/setup-micromamba@v3
        if: matrix.platform == 'macos-arm64'
        with:
          environment-file: packaging/idk-environment.yml
          micromamba-version: 2.10.0-0
          cache-downloads: true
          post-cleanup: all
      - name: Resolve release version
        shell: bash
        run: |
          IDK_VERSION=${GITHUB_REF_NAME#v}
          echo "IDK_VERSION=$IDK_VERSION" >> "$GITHUB_ENV"
      - name: Package and verify macOS IDK
        if: matrix.platform == 'macos-arm64'
        shell: bash -el {0}
        run: |
          export IRONWOOD_IDK_TOOLCHAIN_HOME="$CONDA_PREFIX"
          ./scripts/build-release-idk.sh "$IDK_VERSION" "${{ matrix.platform }}"
      - name: Package and verify Linux IDK
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          # The fixed install/cache paths preserve the qualified sysroot receipt.
          docker build --platform "${{ matrix.docker-platform }}" \
            --file scripts/platform-tests/Dockerfile --tag ironwood-release-idk .
          docker run --rm --platform "${{ matrix.docker-platform }}" \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --env IRONWOOD_IDK_TOOLCHAIN_HOME=/opt/ironwood-toolchain \
            --env "IRONWOOD_GC_HOME=$GITHUB_WORKSPACE/workspace/release-inputs/gc/${{ matrix.platform }}" \
            --env "IRONWOOD_BRIDGE_SUPPORT_HOME=$GITHUB_WORKSPACE/workspace/release-inputs/support/${{ matrix.platform }}" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" ironwood-release-idk \
            bash scripts/build-release-idk.sh "$IDK_VERSION" "${{ matrix.platform }}"
      - name: Upload IDK to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "dist/ironwood-idk-$IDK_VERSION-${{ matrix.platform }}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  verify-idk:
    name: Verify downloaded ${{ matrix.platform }} IDK
    needs: build-idk
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            platform: macos-arm64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: ubuntu-24.04
            platform: linux-x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      # Draft releases are only visible to tokens with push access.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Select qualified Apple SDK
        if: matrix.platform == 'macos-arm64'
        run: |
          echo 'DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer' >> "$GITHUB_ENV"
          echo 'SDKROOT=/Applications/Xcode_27.2.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX27.2.sdk' >> "$GITHUB_ENV"
      - name: Download and smoke-test draft release IDK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IRONWOOD_PLATFORM: ${{ matrix.platform }}
        run: |
          IDK_VERSION=${GITHUB_REF_NAME#v}
          IDK_ASSET="ironwood-idk-$IDK_VERSION-$IRONWOOD_PLATFORM.tar.gz"
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$IDK_ASSET" \
            --dir dist
          test -f "dist/$IDK_ASSET"
          ./scripts/test-idk.sh "dist/$IDK_ASSET"
          ./scripts/test-idk.sh "dist/$IDK_ASSET" --gc9

  publish-release:
    name: Publish GitHub release
    needs: verify-idk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IDK_VERSION=${GITHUB_REF_NAME#v}
          ASSETS=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name')
          for PLATFORM in macos-arm64 linux-arm64 linux-x86_64; do
            EXPECTED="ironwood-idk-$IDK_VERSION-$PLATFORM.tar.gz"
            grep -Fx "$EXPECTED" <<< "$ASSETS" >/dev/null
          done
          test "$(wc -l <<< "$ASSETS" | tr -d ' ')" -eq 3
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
